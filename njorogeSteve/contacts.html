<div class="toplink-right">

    <div class="banner">
        <h1>Talk to us</h1>
    </div>

    <div class="row">
        <div class="left_side_bar">
            <h3>Left Side Bar</h3>
        </div>
        
        <div class="content">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
            
            <form action="">
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" name="fullname" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" placeholder="Email Address" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="display: flex; flex-direction: row; gap: 5px;">
                        <select name="country_code" style="width: 110px;">
                            <option value="+254">🇰🇪 +254</option>
                            <option value="+27">🇿🇦 +27</option>
                            <option value="+250">🇷🇼 +250</option>
                            <option value="+255">🇹🇿 +255</option>
                        </select>
                        <input type="tel" name="phone" placeholder="Phone Number" style="flex-grow: 1;">
                    </div>
                    <div class="form-group">
                        <select name="country" required>
                            <option value="">Select Country</option>
                            <option value="Kenya">🇰🇪 Kenya</option>
                            <option value="South Africa">🇿🇦 South Africa</option>
                            <option value="Rwanda">🇷🇼 Rwanda</option>
                            <option value="Tanzania">🇹🇿 Tanzania</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <input type="text" name="subject" placeholder="Subject" required style="margin-bottom: 20px;">
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>

            <dl>
                <dt>Email</dt>
                <dd><a href="mailto:bbitc@whitehouse.gov">bbitc@whitehouse.gov</a></dd>
                <dt>Phone</dt>
                <dd><a href="tel:+254765432109">🇰🇪 +254 765 432 109</a></dd>
                <dt>Address</dt>
                <dd>Jokajok</dd>
            </dl>
        </div>

        <div class="right_side_bar">
            <h3>Right Side Bar</h3>
        </div>
    </div>

    </div>
