<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div class="toplink">
        <a href="indice.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="faqs.html">FAQs</a>
        <a href="contacts.html">Contact</a>
    </div>

    <div class="banner">
        <h1>Join Us Today!</h1>
    </div>

    <div class="row">
        <div class="left_side_bar">
            <h3>Benefits</h3>
            <p>Exclusive deals and weekly updates.</p>
        </div>

        <div class="content">
            <h1>Sign Up</h1>
            <p>Stay updated with the latest news and exclusive offers.</p>

            <form action="" method="post" id="signupForm" name="signupForm">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" maxlength="60" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" maxlength="60" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" maxlength="13">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>

                <button type="submit">Create Account</button>
            </form>
        </div>

        <div class="right_side_bar">
            <h3>Privacy</h3>
            <p>Your data is safe with us.</p>
        </div>
    </div>

    <div class="footer">
        &#169; BBIT 2026
    </div>
</body>
</html>
